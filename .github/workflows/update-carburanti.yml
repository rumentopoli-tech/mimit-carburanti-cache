name: Update Carburanti MIMIT

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas requests

      - name: Run updater
        run: python scripts/update_carburanti.py
        env:
          PROXY_URL: "https://mimit-proxy.rumentopoli.workers.dev"

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Update carburanti $(date +%Y-%m-%d)" || echo "No changes"
          git push
